name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Линтер
        run: ruff check unit_economics tests
      - name: Тесты
        run: python -m pytest
      - name: Отчёт собирается на демонстрационных данных
        run: |
          python -m unit_economics.cli demo --out /tmp/demo
          python -m unit_economics.cli report --data /tmp/demo --html /tmp/report.html
          python -m unit_economics.cli check --data /tmp/demo
